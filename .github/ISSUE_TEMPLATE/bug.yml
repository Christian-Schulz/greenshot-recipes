name: Bug in a recipe
description: A recipe doesn't do what it says
labels: [bug]
body:
  - type: input
    id: recipe
    attributes:
      label: Recipe id
      description: The folder name under recipes/
    validations:
      required: true
  - type: input
    id: greenshot
    attributes:
      label: Greenshot version
      description: Help > About
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
