name: Check recipes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Greenshot's recipe schema; schema only for now, Greenshot's own validator comes later
      GREENSHOT_REF: ${{ vars.GREENSHOT_REF || 'main' }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: python -m pip install jsonschema==4.23.0

      - name: Get the recipe schema
        # by commit: raw.githubusercontent.com caches a branch name for minutes
        run: |
          sha=$(git ls-remote https://github.com/greenshot/greenshot "$GREENSHOT_REF" | head -n 1 | cut -f 1)
          sha=${sha:-$GREENSHOT_REF}
          curl -fsSL -o "$RUNNER_TEMP/recipe.schema.json" "https://raw.githubusercontent.com/greenshot/greenshot/$sha/docs/vNext/recipe.schema.json"

      - name: Check
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python tools/catalog.py check --schema "$RUNNER_TEMP/recipe.schema.json" --base "origin/$BASE_REF" --pr-author "$PR_AUTHOR"
          else
            python tools/catalog.py check --schema "$RUNNER_TEMP/recipe.schema.json"
          fi
